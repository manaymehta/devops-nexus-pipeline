# Continuous Integration: runs on GitHub's cloud machines for every push and pull request.
# Build -> test -> package the jar -> build a Docker image from that jar -> smoke-test the container.
# Publishing to Nexus and deployment live in separate workflows (they need the Nexus machine).
name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compiles, runs all unit/API tests, then packages the jar.
      # Any failing test stops the pipeline here.
      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/target/surefire-reports/

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: app/target/devops-app-*.jar
          if-no-files-found: error

  docker:
    name: Docker image & smoke test
    needs: build-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # Reuse the jar that passed the tests instead of building it again.
      - name: Download tested jar
        uses: actions/download-artifact@v8
        with:
          name: app-jar
          path: app/target

      - name: Build image
        run: docker build -t devops-app:${{ github.sha }} .

      - name: Run container
        run: docker run -d --name devops-app -p 8080:8080 devops-app:${{ github.sha }}

      - name: Smoke test
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/actuator/health; then break; fi
            sleep 2
          done
          echo
          curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'
          curl -sf http://localhost:8080/api/version
          echo
          curl -sf -X POST http://localhost:8080/api/tasks \
            -H 'Content-Type: application/json' -d '{"title":"smoke test"}'

      - name: Container logs
        if: always()
        run: docker logs devops-app

      - name: Stop container
        if: always()
        run: docker rm -f devops-app
